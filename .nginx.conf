# Required events block
events {
    worker_connections 1024;
}

# HTTP server configuration
http {
    include /etc/nginx/mime.types;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # redirect http to https
    server {
    	listen 80;
    	listen [::]:80;
    	server_name oneconnect-local.com www.oneconnect-local.com;
	#root /usr/share/nginx/html;
	#index index.html;

	#location / {
	#    try_files $uri /index.html;
	#    return 301 https://$host$request_uri;
	return 301 https://$host$request_uri;
    }
    # serve https traffic
    server{
	listen 443 ssl; 
	listen [::]:443 ssl; 
	server_name oneconnect-local.com www.oneconnect-local.com;
	
	ssl_certificate /etc/nginx/ssl/no-ip.pem;
	ssl_certificate_key /etc/nginx/ssl/no-ip.key;

	ssl_protocols TLSV1.2 TLSv1.3;
	ssl_ciphers 'HIGH:!aNULL:!MD5';
	ssl_prefer_server_ciphers on;
	
	root /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri /index.html;
	}
	location /api/ {
	    proxy_pass http://geo-map-api:3000;  # Proxy requests to your backend API
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
	    }

        # Optional: Enable gzip compression for faster loading
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }
}
